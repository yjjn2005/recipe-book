<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>레시피북 · 유앤김패밀리</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0F2544; --navy-deep:#0A1830; --gold:#C6A15B; --gold-soft:#E4CD9C;
  --cream:#FBF9F4; --ink:#2A2A28; --line:#E6DCC6;
}
*{box-sizing:border-box;}
body{
  margin:0; font-family:'Nanum Gothic',sans-serif; background:var(--cream); color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
.topbar{
  background:linear-gradient(155deg,var(--navy-deep) 0%,var(--navy) 65%);
  color:#fff; padding:22px 20px 18px 20px; position:sticky; top:0; z-index:20;
  border-bottom:2px solid var(--gold);
}
.topbar-inner{max-width:900px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px;}
.brand{display:flex; flex-direction:column;}
.brand .kicker{color:var(--gold-soft); font-size:9px; letter-spacing:2.5px; font-weight:700;}
.brand h1{font-family:'Noto Serif KR',serif; font-weight:900; font-size:22px; margin:3px 0 0 0;}
.pin-badge{
  border:1px solid var(--gold); color:var(--gold-soft); background:transparent;
  font-size:11px; padding:6px 12px; border-radius:16px; cursor:pointer; font-weight:700;
  white-space:nowrap;
}

.category-bar{max-width:900px; margin:16px auto 0 auto; padding:0 16px; display:flex; gap:10px;}
.cat-btn{
  flex:1; padding:14px 10px; border-radius:12px; border:2px solid var(--line);
  background:#fff; font-family:'Noto Serif KR',serif; font-weight:700; font-size:15px;
  color:#999; cursor:pointer; transition:all .15s;
}
.cat-btn.active{ border-color:var(--gold); color:var(--navy); background:#FFFDF7;
  box-shadow:0 2px 10px rgba(198,161,91,0.25); }

.tag-row{max-width:900px; margin:12px auto 0 auto; padding:0 16px; display:flex; gap:8px; flex-wrap:wrap;}
.tag-chip{
  padding:6px 14px; border-radius:16px; border:1px solid var(--line); background:#fff;
  font-size:12.5px; color:#666; cursor:pointer; font-weight:700;
}
.tag-chip.active{ background:var(--navy); color:var(--gold-soft); border-color:var(--navy); }

.search-row{max-width:900px; margin:12px auto 0 auto; padding:0 16px;}
.search-row input{
  width:100%; padding:11px 14px; border-radius:10px; border:1px solid var(--line);
  font-size:14px; font-family:'Nanum Gothic',sans-serif; background:#fff;
}

.grid{
  max-width:900px; margin:18px auto 40px auto; padding:0 16px;
  display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px;
}
.card{
  background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden;
  cursor:pointer; transition:transform .15s, box-shadow .15s;
}
.card:hover{ transform:translateY(-2px); box-shadow:0 8px 20px rgba(15,37,68,0.12); }
.card-head{ background:linear-gradient(155deg,var(--navy-deep) 0%,var(--navy) 65%); padding:16px 18px 12px 18px; }
.card-head .name{ font-family:'Noto Serif KR',serif; font-weight:900; color:#fff; font-size:19px; }
.card-head .summary{ color:#C9BEA9; font-size:11.5px; margin-top:4px; line-height:1.4; }
.card-body{ padding:12px 18px 16px 18px; }
.card-meta{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
.pill{ border:1px solid var(--gold); color:var(--navy); font-size:10.5px; padding:2px 9px; border-radius:12px; font-weight:700;}
.card-tags{ display:flex; gap:5px; flex-wrap:wrap; }
.mini-tag{ font-size:10px; color:#999; background:#F3F1EB; padding:2px 8px; border-radius:9px; }

.empty-state{ max-width:900px; margin:60px auto; text-align:center; color:#999; padding:0 20px; }

.fab{
  position:fixed; right:20px; bottom:20px; width:56px; height:56px; border-radius:50%;
  background:var(--navy); color:var(--gold-soft); border:2px solid var(--gold);
  font-size:26px; display:flex; align-items:center; justify-content:center; cursor:pointer;
  box-shadow:0 6px 18px rgba(15,37,68,0.35); z-index:30;
}

/* Modal (recipe detail / add form / pin) */
.overlay{
  display:none; position:fixed; inset:0; background:rgba(10,24,48,0.55); z-index:50;
  align-items:flex-start; justify-content:center; overflow-y:auto; padding:26px 14px;
}
.overlay.show{ display:flex; }
.modal{
  background:var(--cream); max-width:640px; width:100%; border-radius:14px; overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,0.3);
}
.modal-close{
  position:absolute; top:14px; right:16px; color:#fff; background:rgba(255,255,255,0.15);
  border:none; width:30px; height:30px; border-radius:50%; font-size:16px; cursor:pointer;
}

/* Recipe detail styles (matches PDF card) */
.rband{ background:linear-gradient(155deg,var(--navy-deep) 0%,var(--navy) 65%); padding:24px 28px 18px 28px; position:relative;}
.rband::after{ content:""; display:block; margin-top:14px; height:2px; background:linear-gradient(90deg,var(--gold) 0%, var(--gold-soft) 45%, transparent 100%);}
.rkicker{ color:var(--gold-soft); font-size:9px; letter-spacing:2.5px; font-weight:700; }
.rname{ font-family:'Noto Serif KR',serif; font-weight:900; color:#fff; font-size:26px; margin:8px 0 6px 0; }
.rsummary{ font-family:'Noto Serif KR',serif; color:#D8CDBB; font-size:11px; }
.rmeta{ display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
.rmeta span{ border:1px solid var(--gold); color:var(--gold-soft); font-size:10.5px; padding:4px 12px; border-radius:16px; font-weight:700;}
.rcontent{ padding:10px 28px 26px 28px; }
.rsection{ margin-top:18px; }
.rsection-title{ font-family:'Noto Serif KR',serif; font-weight:700; color:var(--navy); font-size:14px; display:flex; align-items:center; gap:8px;}
.rsection-title .num{ display:inline-flex; align-items:center; justify-content:center; width:19px; height:19px; border-radius:50%; background:var(--navy); color:var(--gold-soft); font-size:9.5px; font-weight:800;}
.rrule{ height:1px; background:linear-gradient(90deg,var(--gold) 0%, #E9DFC8 40%, transparent 100%); margin:6px 0 10px 0;}
.ing-row{ display:flex; justify-content:space-between; align-items:baseline; padding:6px 0; border-bottom:1px dotted #D8CBB0; font-size:13px;}
.ing-row .iname{ font-weight:700; }
.ing-row .inote{ display:block; color:#999; font-size:10.5px; margin-top:1px; font-weight:400;}
.ing-row .iamt{ font-family:'Noto Serif KR',serif; color:var(--navy); font-weight:700; font-size:12.5px; white-space:nowrap; padding-left:10px;}
.step-row{ display:flex; gap:10px; margin-bottom:9px; align-items:flex-start; font-size:13px;}
.step-row .snum{ flex:0 0 auto; width:21px; height:21px; border-radius:50%; border:1.4px solid var(--gold); color:var(--navy); font-weight:800; font-size:10.5px; display:flex; align-items:center; justify-content:center;}
ul.plainlist{ margin:0; padding-left:0; list-style:none; }
ul.plainlist li{ padding:4px 0 4px 15px; position:relative; font-size:13px;}
ul.plainlist li::before{ content:""; position:absolute; left:0; top:11px; width:5px; height:5px; background:var(--gold); border-radius:50%;}
.healthbox{ background:#fff; border:1px solid var(--gold-soft); border-left:3px solid var(--gold); border-radius:4px; padding:10px 18px;}
.rtaglist{ display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;}
.rtag{ font-size:11px; background:#F3F1EB; color:#777; padding:3px 10px; border-radius:10px;}
.rfooter{ text-align:center; padding:16px 28px 22px 28px;}
.rfooter .rule2{ height:1px; background:linear-gradient(90deg,transparent 0%, var(--gold) 50%, transparent 100%); margin-bottom:10px;}
.rfooter .brand2{ font-family:'Noto Serif KR',serif; font-weight:700; letter-spacing:2px; color:var(--navy); font-size:10px;}
.rfooter .tagline{ color:#999; font-size:8.5px; margin-top:2px; }
.detail-actions{ display:flex; gap:8px; padding:0 28px 20px 28px; }
.btn{ flex:1; padding:10px; border-radius:8px; border:none; font-weight:700; font-size:13px; cursor:pointer; }
.btn-pdf{ background:var(--navy); color:var(--gold-soft); }
.btn-del{ background:#fff; color:#B3403A; border:1px solid #E6B8B3; }

/* Add/Edit form modal */
.form-wrap{ padding:20px 24px; }
.form-wrap h2{ font-family:'Noto Serif KR',serif; color:var(--navy); margin-top:0;}
.form-wrap label{ display:block; font-size:12px; font-weight:700; color:#555; margin:12px 0 4px 0;}
.form-wrap input, .form-wrap textarea{
  width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px; font-family:'Nanum Gothic'; font-size:13px;
}
.form-wrap textarea{ min-height:70px; resize:vertical; }
.form-hint{ font-size:11px; color:#999; margin-top:3px; }
.form-actions{ display:flex; gap:8px; margin-top:18px; }
.btn-save{ background:var(--navy); color:var(--gold-soft); }
.btn-cancel{ background:#eee; color:#555; }

/* PIN modal */
.pin-wrap{ padding:30px 26px; text-align:center; }
.pin-wrap h2{ font-family:'Noto Serif KR',serif; color:var(--navy); }
.pin-wrap input{
  width:160px; text-align:center; letter-spacing:6px; font-size:20px; padding:10px;
  border:1px solid var(--line); border-radius:8px; margin:14px 0;
}
.sync-status{ font-size:11px; color:#999; margin-top:8px; }

@media print{
  .topbar,.category-bar,.tag-row,.search-row,.grid,.fab{ display:none !important; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="kicker">유 앤 김 패 밀 리</div>
      <h1>레시피북</h1>
    </div>
    <button class="pin-badge" onclick="openPinModal()" id="pinBtn">PIN 동기화</button>
  </div>
</div>

<div class="category-bar">
  <button class="cat-btn active" id="catTasteBtn" onclick="setCategory('taste')">맛으로 찾기</button>
  <button class="cat-btn" id="catHealthBtn" onclick="setCategory('health')">건강으로 찾기</button>
</div>

<div class="tag-row" id="tagRow"></div>

<div class="search-row">
  <input type="text" id="searchInput" placeholder="요리 이름으로 검색 (예: 갈비찜, 대구탕)" oninput="renderGrid()">
</div>

<div class="grid" id="grid"></div>
<div class="empty-state" id="emptyState" style="display:none;">저장된 레시피가 없습니다. 오른쪽 아래 + 버튼으로 추가해보세요.</div>

<div class="fab" onclick="openAddForm()">+</div>

<!-- Recipe Detail Modal -->
<div class="overlay" id="detailOverlay">
  <div class="modal" style="position:relative;">
    <button class="modal-close" onclick="closeModal('detailOverlay')">✕</button>
    <div id="detailContent"></div>
  </div>
</div>

<!-- Add/Edit Form Modal -->
<div class="overlay" id="formOverlay">
  <div class="modal" style="position:relative;">
    <button class="modal-close" onclick="closeModal('formOverlay')" style="color:#333;background:rgba(0,0,0,0.08);">✕</button>
    <div class="form-wrap">
      <h2>레시피 추가</h2>
      <p class="form-hint">채팅에서 recipe-lookup 스킬로 받은 JSON을 그대로 붙여넣거나, 아래 개별 항목을 입력하세요.</p>
      <label>JSON 붙여넣기 (선택)</label>
      <textarea id="jsonPaste" placeholder='{"name":"대구탕", "summary":"...", ...}'></textarea>
      <button class="btn" style="background:#F3F1EB;color:var(--navy);margin-top:6px;" onclick="parseJsonPaste()">JSON 불러오기</button>
      <hr style="margin:18px 0;border:none;border-top:1px solid var(--line);">
      <label>요리 이름 *</label>
      <input id="f_name" type="text">
      <label>한 줄 소개</label>
      <input id="f_summary" type="text">
      <label>난이도 / 소요시간 / 인분</label>
      <div style="display:flex; gap:8px;">
        <input id="f_difficulty" placeholder="쉬움" style="flex:1;">
        <input id="f_time" placeholder="20분" style="flex:1;">
        <input id="f_servings" placeholder="2인분" style="flex:1;">
      </div>
      <label>재료 (한 줄에 하나, "이름 | 분량 | 비고")</label>
      <textarea id="f_ingredients" placeholder="대구 | 400g | 마트 손질 생선코너"></textarea>
      <label>조리 순서 (한 줄에 한 단계)</label>
      <textarea id="f_steps"></textarea>
      <label>영양 포인트 (한 줄에 하나)</label>
      <textarea id="f_nutrition"></textarea>
      <label>건강 고려사항 (한 줄에 하나)</label>
      <textarea id="f_health_notes"></textarea>
      <label>보관·활용 팁 (한 줄에 하나)</label>
      <textarea id="f_tips"></textarea>
      <label>맛 태그 (쉼표로 구분, 예: 얼큰함, 시원한 국물)</label>
      <input id="f_tag_taste" type="text">
      <label>건강 태그 (쉼표로 구분, 예: 저염, 고단백)</label>
      <input id="f_tag_health" type="text">
      <div class="form-actions">
        <button class="btn btn-save" onclick="saveRecipeFromForm()">저장</button>
        <button class="btn btn-cancel" onclick="closeModal('formOverlay')">취소</button>
      </div>
    </div>
  </div>
</div>

<!-- PIN Modal -->
<div class="overlay" id="pinOverlay">
  <div class="modal" style="position:relative;">
    <button class="modal-close" onclick="closeModal('pinOverlay')" style="color:#333;background:rgba(0,0,0,0.08);">✕</button>
    <div class="pin-wrap">
      <h2>기기 간 동기화</h2>
      <p style="font-size:12px;color:#777;">같은 PIN을 입력하면 모든 기기에서 같은 레시피 목록을 볼 수 있어요.</p>
      <input type="text" id="pinInput" maxlength="4" placeholder="PIN">
      <div>
        <button class="btn btn-save" style="width:120px;" onclick="pullFromCloud()">불러오기</button>
        <button class="btn" style="width:120px;background:#F3F1EB;color:var(--navy);" onclick="pushToCloud()">저장하기</button>
      </div>
      <div class="sync-status" id="syncStatus"></div>
    </div>
  </div>
</div>

let state = {
  category:"taste",
  activeTags:[],
  recipes: loadLocal()
};

function loadLocal(){
  const raw = localStorage.getItem("recipebook_data");
  if(raw){ try{ return JSON.parse(raw); }catch(e){} }
  return SEED_RECIPES.slice();
}
function saveLocal(){
  localStorage.setItem("recipebook_data", JSON.stringify(state.recipes));
}

function setCategory(cat){
  state.category = cat;
  state.activeTags = [];
  document.getElementById("catTasteBtn").classList.toggle("active", cat==="taste");
  document.getElementById("catHealthBtn").classList.toggle("active", cat==="health");
  renderTags();
  renderGrid();
}

function renderTags(){
  const tags = state.category === "taste" ? TASTE_TAGS : HEALTH_TAGS;
  const row = document.getElementById("tagRow");
  row.innerHTML = tags.map(t => {
    const active = state.activeTags.includes(t);
    return `<button class="tag-chip ${active?'active':''}" onclick="toggleTag('${t.replace(/'/g,"\\'")}')">${t}</button>`;
  }).join("");
}
function toggleTag(t){
  const i = state.activeTags.indexOf(t);
  if(i>=0) state.activeTags.splice(i,1); else state.activeTags.push(t);
  renderTags();
  renderGrid();
}

function renderGrid(){
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  const grid = document.getElementById("grid");
  const catKey = state.category;
  let list = state.recipes.filter(r=>{
    if(q && !r.name.toLowerCase().includes(q)) return false;
    if(state.activeTags.length){
      const rtags = (r.tags && r.tags[catKey]) || [];
      if(!state.activeTags.every(t=>rtags.includes(t))) return false;
    }
    return true;
  });
  document.getElementById("emptyState").style.display = list.length? "none":"block";
  grid.innerHTML = list.map(r=>{
    const rtags = (r.tags && r.tags[catKey]) || [];
    return `<div class="card" onclick="openDetail('${r.id}')">
      <div class="card-head">
        <div class="name">${esc(r.name)}</div>
        <div class="summary">${esc(r.summary||"")}</div>
      </div>
      <div class="card-body">
        <div class="card-meta">
          <span class="pill">${esc(r.difficulty||"")}</span>
          <span class="pill">${esc(r.time||"")}</span>
        </div>
        <div class="card-tags">${rtags.map(t=>`<span class="mini-tag">${esc(t)}</span>`).join("")}</div>
      </div>
    </div>`;
  }).join("");
}

function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function openDetail(id){
  const r = state.recipes.find(x=>x.id===id);
  if(!r) return;
  const ing = (r.ingredients||[]).map(i=>`
    <div class="ing-row"><div><span class="iname">${esc(i.item)}</span>${i.note?`<span class="inote">${esc(i.note)}</span>`:""}</div><span class="iamt">${esc(i.amount||"")}</span></div>`).join("");
  const steps = (r.steps||[]).map((s,idx)=>`<div class="step-row"><div class="snum">${idx+1}</div><div>${esc(s)}</div></div>`).join("");
  const nutrition = (r.nutrition||[]).map(s=>`<li>${esc(s)}</li>`).join("");
  const health = (r.health_notes||[]).map(s=>`<li>${esc(s)}</li>`).join("");
  const tips = (r.tips||[]).map(s=>`<li>${esc(s)}</li>`).join("");
  const tasteTags = (r.tags&&r.tags.taste||[]).map(t=>`<span class="rtag">${esc(t)}</span>`).join("");
  const healthTags = (r.tags&&r.tags.health||[]).map(t=>`<span class="rtag">${esc(t)}</span>`).join("");

  document.getElementById("detailContent").innerHTML = `
    <div class="rband">
      <div class="rkicker">간 편 · 건 강 레 시 피 카 드</div>
      <div class="rname">${esc(r.name)}</div>
      <div class="rsummary">${esc(r.summary||"")}</div>
      <div class="rmeta">
        <span>난이도 ${esc(r.difficulty||"")}</span>
        <span>${esc(r.time||"")}</span>
        <span>${esc(r.servings||"")}</span>
      </div>
    </div>
    <div class="rcontent">
      <div class="rsection"><div class="rsection-title"><span class="num">1</span>재료</div><div class="rrule"></div>${ing}</div>
      <div class="rsection"><div class="rsection-title"><span class="num">2</span>조리 순서</div><div class="rrule"></div>${steps}</div>
      <div class="rsection"><div class="rsection-title"><span class="num">3</span>영양 포인트</div><div class="rrule"></div><ul class="plainlist">${nutrition}</ul></div>
      <div class="rsection"><div class="rsection-title"><span class="num">4</span>건강 고려사항</div><div class="rrule"></div><div class="healthbox"><ul class="plainlist">${health}</ul></div></div>
      <div class="rsection"><div class="rsection-title"><span class="num">5</span>보관·활용 팁</div><div class="rrule"></div><ul class="plainlist">${tips}</ul></div>
      <div class="rsection">
        <div class="rsection-title"><span class="num">#</span>태그</div><div class="rrule"></div>
        <div style="font-size:11px;color:#999;margin-bottom:3px;">맛</div>
        <div class="rtaglist">${tasteTags||'<span class="rtag">-</span>'}</div>
        <div style="font-size:11px;color:#999;margin:8px 0 3px 0;">건강</div>
        <div class="rtaglist">${healthTags||'<span class="rtag">-</span>'}</div>
      </div>
    </div>
    <div class="detail-actions">
      <button class="btn btn-pdf" onclick="window.print()">인쇄 / PDF 저장</button>
      <button class="btn btn-del" onclick="deleteRecipe('${r.id}')">삭제</button>
    </div>
    <div class="rfooter">
      <div class="rule2"></div>
      <div class="brand2">유 앤 김 패 밀 리</div>
      <div class="tagline">PINETREE FAMILY OFFICE · 간편 건강 레시피 컬렉션</div>
    </div>
  `;
  document.getElementById("detailOverlay").classList.add("show");
}

function deleteRecipe(id){
  if(!confirm("이 레시피를 삭제할까요?")) return;
  state.recipes = state.recipes.filter(r=>r.id!==id);
  saveLocal();
  closeModal("detailOverlay");
  renderGrid();
}

function closeModal(id){ document.getElementById(id).classList.remove("show"); }

function openAddForm(){
  ["f_name","f_summary","f_difficulty","f_time","f_servings","f_ingredients","f_steps","f_nutrition","f_health_notes","f_tips","f_tag_taste","f_tag_health","jsonPaste"]
  .forEach(id=>document.getElementById(id).value="");
  document.getElementById("formOverlay").classList.add("show");
}

function parseJsonPaste(){
  const raw = document.getElementById("jsonPaste").value.trim();
  if(!raw) return;
  try{
    const d = JSON.parse(raw);
    document.getElementById("f_name").value = d.name||"";
    document.getElementById("f_summary").value = d.summary||"";
    document.getElementById("f_difficulty").value = d.difficulty||"";
    document.getElementById("f_time").value = d.time||"";
    document.getElementById("f_servings").value = d.servings||"";
    document.getElementById("f_ingredients").value = (d.ingredients||[]).map(i=>`${i.item} | ${i.amount||""} | ${i.note||""}`).join("\n");
    document.getElementById("f_steps").value = (d.steps||[]).join("\n");
    document.getElementById("f_nutrition").value = (d.nutrition||[]).join("\n");
    document.getElementById("f_health_notes").value = (d.health_notes||[]).join("\n");
    document.getElementById("f_tips").value = (d.tips||[]).join("\n");
    if(d.tags){
      document.getElementById("f_tag_taste").value = (d.tags.taste||[]).join(", ");
      document.getElementById("f_tag_health").value = (d.tags.health||[]).join(", ");
    }
  }catch(e){ alert("JSON 형식을 확인해주세요."); }
}

function saveRecipeFromForm(){
  const name = document.getElementById("f_name").value.trim();
  if(!name){ alert("요리 이름을 입력해주세요."); return; }
  const ingredients = document.getElementById("f_ingredients").value.split("\n").filter(x=>x.trim()).map(line=>{
    const [item,amount,note] = line.split("|").map(s=>s?s.trim():"");
    return {item:item||"", amount:amount||"", note:note||""};
  });
  const splitLines = (id)=>document.getElementById(id).value.split("\n").map(s=>s.trim()).filter(Boolean);
  const rec = {
    id: "r_"+Date.now(),
    name,
    summary: document.getElementById("f_summary").value.trim(),
    difficulty: document.getElementById("f_difficulty").value.trim(),
    time: document.getElementById("f_time").value.trim(),
    servings: document.getElementById("f_servings").value.trim(),
    ingredients,
    steps: splitLines("f_steps"),
    nutrition: splitLines("f_nutrition"),
    health_notes: splitLines("f_health_notes"),
    tips: splitLines("f_tips"),
    tags: {
      taste: document.getElementById("f_tag_taste").value.split(",").map(s=>s.trim()).filter(Boolean),
      health: document.getElementById("f_tag_health").value.split(",").map(s=>s.trim()).filter(Boolean)
    }
  };
  state.recipes.push(rec);
  saveLocal();
  closeModal("formOverlay");
  renderGrid();
}

/* ---- PIN sync ---- */
function openPinModal(){
  document.getElementById("pinInput").value = localStorage.getItem("recipebook_pin") || "";
  document.getElementById("syncStatus").textContent = "";
  document.getElementById("pinOverlay").classList.add("show");
}
async function sha256Hex(str){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
async function pullFromCloud(){
  const pin = document.getElementById("pinInput").value.trim();
  if(!pin){ alert("PIN을 입력해주세요."); return; }
  const status = document.getElementById("syncStatus");
  status.textContent = "불러오는 중...";
  try{
    const key = await sha256Hex("recipe:"+pin);
    const res = await fetch(`${API_BASE}/sync?key=${key}`);
    if(!res.ok) throw new Error("no data");
    const data = await res.json();
    if(data && data.recipes){
      state.recipes = data.recipes;
      saveLocal();
      localStorage.setItem("recipebook_pin", pin);
      renderGrid();
      status.textContent = `불러오기 완료 (${data.recipes.length}개 레시피)`;
    }else{
      status.textContent = "저장된 데이터가 없습니다.";
    }
  }catch(e){
    status.textContent = "동기화 서버에 연결할 수 없거나 저장된 데이터가 없습니다.";
  }
}
async function pushToCloud(){
  const pin = document.getElementById("pinInput").value.trim();
  if(!pin){ alert("PIN을 입력해주세요."); return; }
  const status = document.getElementById("syncStatus");
  status.textContent = "저장하는 중...";
  try{
    const key = await sha256Hex("recipe:"+pin);
    const res = await fetch(`${API_BASE}/sync?key=${key}`, {
      method:"PUT",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({recipes: state.recipes, updatedAt: new Date().toISOString()})
    });
    if(!res.ok) throw new Error("save failed");
    localStorage.setItem("recipebook_pin", pin);
    status.textContent = "저장 완료 — 다른 기기에서 같은 PIN으로 불러올 수 있어요.";
  }catch(e){
    status.textContent = "저장 실패. 잠시 후 다시 시도해주세요.";
  }
}

/* init */
renderTags();
renderGrid();
</script>
